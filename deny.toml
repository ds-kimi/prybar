# cargo-deny: license allowlist, advisories and duplicate sources.
[graph]
all-features = false

[advisories]
version = 2
yanked = "deny"
# paste: compile-time proc-macro of steamworks, opt-in `workshop` feature
# only; unmaintained, not vulnerable, no maintained replacement upstream.
# chrono: required by rmcp and schemars (the MCP server's SDK); unmaintained,
# not vulnerable, prybar never calls it.
ignore = [
    { id = "RUSTSEC-2024-0436", reason = "steamworks build-time macro" },
    { id = "RUSTSEC-2026-0543", reason = "chrono via rmcp/schemars, unmaintained only" },
]

[licenses]
unused-allowed-license = "allow"
version = 2
allow = ["MIT", "Apache-2.0", "Apache-2.0 WITH LLVM-exception", "Unicode-3.0", "BSD-2-Clause", "BSD-3-Clause", "ISC", "Zlib", "Unlicense", "CC0-1.0"]

[bans]
multiple-versions = "warn"
wildcards = "allow"

[sources]
unknown-registry = "deny"
unknown-git = "deny"

[licenses.private]
# Workspace crates carry the custom LICENSE file, not an SPDX id.
ignore = true
