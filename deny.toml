# cargo-deny: license allowlist, advisories and duplicate sources.
[graph]
all-features = false

[advisories]
version = 2
yanked = "deny"
# paste: compile-time proc-macro of steamworks, opt-in `workshop` feature
# only; unmaintained, not vulnerable, no maintained replacement upstream.
# chrono: required by rmcp and schemars (the MCP server's SDK); unmaintained,
# not vulnerable, prybar never calls it.
ignore = [
    { id = "RUSTSEC-2024-0436", reason = "steamworks build-time macro" },
    { id = "RUSTSEC-2026-0543", reason = "chrono via rmcp/schemars, unmaintained only" },
]

[licenses]
unused-allowed-license = "allow"
version = 2
# MPL-2.0: file-level copyleft, pulled by GPUI (dwrote, cbindgen, option-ext)
# and used unmodified, so it puts no terms on prybar code.
# CDLA-Permissive-2.0: Mozilla's CA root list (webpki-roots), data only, used
# by the update check's TLS client.
allow = ["CDLA-Permissive-2.0", "MPL-2.0", "MIT", "Apache-2.0", "Apache-2.0 WITH LLVM-exception", "Unicode-3.0", "BSD-2-Clause", "BSD-3-Clause", "ISC", "Zlib", "Unlicense", "CC0-1.0"]

[bans]
multiple-versions = "warn"
wildcards = "allow"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
# GPUI is only published as part of the Zed repository; it pulls these forks.
allow-git = [
    "https://github.com/zed-industries/zed",
    "https://github.com/zed-industries/font-kit",
    "https://github.com/zed-industries/oo7",
    "https://github.com/zed-industries/scap",
    "https://github.com/zed-industries/wasm_thread",
    "https://github.com/zed-industries/xim-rs.git",
    "https://github.com/gfx-rs/wgpu",
]

[licenses.private]
# Workspace crates carry the custom LICENSE file, not an SPDX id.
ignore = true
