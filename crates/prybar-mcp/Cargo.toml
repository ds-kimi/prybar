[package]
name = "prybar-mcp"
version.workspace = true
edition.workspace = true
license-file.workspace = true
publish.workspace = true

[[bin]]
name = "prybar-mcp"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
prybar-service = { version = "0.2.0", path = "../prybar-service" }
prybar-workshop = { version = "0.2.0", path = "../prybar-workshop" }
prybar-update = { path = "../prybar-update" }
rmcp = { version = "3.11.0", features = ["server", "transport-io", "macros"] }
schemars = "1.2.3"
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "io-std"] }

[features]
workshop = ["prybar-service/workshop"]

[dev-dependencies]
rmcp = { version = "3.11.0", features = ["client"] }
tempfile.workspace = true
prybar-gma = { path = "../prybar-gma" }

[[test]]
name = "mcp"
path = "tests/mcp/main.rs"

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"
