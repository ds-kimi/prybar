[package]
name = "prybar-cli"
version.workspace = true
edition.workspace = true
license-file.workspace = true
publish.workspace = true
description = "Decompile Source engine models and pack or unpack game packages, for people and AI agents"

[[bin]]
name = "prybar"
path = "src/main.rs"

[dependencies]
prybar-service = { path = "../prybar-service" }
prybar-workshop = { path = "../prybar-workshop" }
clap = { version = "4", features = ["derive"] }
serde.workspace = true
serde_json.workspace = true

[features]
workshop = ["prybar-service/workshop"]

[dev-dependencies]
assert_cmd = "2"
tempfile.workspace = true
serde_json.workspace = true
prybar-vpk = { path = "../prybar-vpk" }
prybar-gma = { path = "../prybar-gma" }

[[test]]
name = "cli"
path = "tests/cli/main.rs"

[lints]
workspace = true
