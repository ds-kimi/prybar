name: Docs issue
description: Something in the docs is wrong, missing, or unclear
labels: ["docs", "needs triage"]
body:
  - type: input
    id: page
    attributes:
      label: Page
      placeholder: docs/cli/README.md, README, prybar --help
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What is wrong or missing
    validations:
      required: true
