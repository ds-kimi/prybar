name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: x86_64-pc-windows-msvc, os: windows-latest }
          - { target: x86_64-unknown-linux-gnu, os: ubuntu-latest }
          - { target: aarch64-unknown-linux-gnu, os: ubuntu-24.04-arm }
          - { target: x86_64-apple-darwin, os: macos-15-intel }
          - { target: aarch64-apple-darwin, os: macos-latest }
    runs-on: ${{ matrix.os }}
    steps:
      # The macOS bundle version only takes numbers; fail fast on every
      # platform instead of after the long GUI build.
      - name: check tag format
        shell: bash
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          if ! [[ "$REF_NAME" =~ ^v[0-9]+(\.[0-9]+){0,2}$ ]]; then
            echo "::error::release tags must look like v1.2.3, got $REF_NAME"
            exit 1
          fi
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: stable
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          key: ${{ matrix.target }}
      # GPUI links against these on Linux (same list as ci.yml).
      - name: gui system libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libfontconfig-dev libfreetype-dev libwayland-dev \
            libx11-xcb-dev libxkbcommon-x11-dev libvulkan1
      # Workshop upload is built in; the Steam API library ships next to
      # the binaries (Linux needs the $ORIGIN rpath to find it there).
      - name: build
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: |
          if [[ "$TARGET" == *linux* ]]; then export RUSTFLAGS='-C link-arg=-Wl,-rpath,$ORIGIN'; fi
          cargo build --release --locked --target "$TARGET" -p prybar-cli -p prybar-mcp \
            --features prybar-cli/workshop,prybar-mcp/workshop
      # The macOS GUI is built later, inside Prybar.app.
      - name: build gui
        if: runner.os != 'macOS'
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          PRYBAR_TELEMETRY_URL: ${{ vars.PRYBAR_TELEMETRY_URL }}
        run: |
          if [[ "$TARGET" == *linux* ]]; then export RUSTFLAGS='-C link-arg=-Wl,-rpath,$ORIGIN'; fi
          cargo build --release --locked --target "$TARGET" -p prybar-gui --features workshop
      - name: stage
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          name="prybar-$REF_NAME-$TARGET"
          mkdir "$name"
          ext=""
          if [[ "$TARGET" == *windows* ]]; then ext=".exe"; fi
          cp "target/$TARGET/release/prybar$ext" "target/$TARGET/release/prybar-mcp$ext" README.md "$name"/
          if [[ "$RUNNER_OS" != "macOS" ]]; then cp "target/$TARGET/release/prybar-gui$ext" "$name"/; fi
          sh scripts/release/steam-lib.sh "$TARGET" "$name" "target/$TARGET/release"
          # Desktop entry and hicolor icons for the Linux archive, so a
          # package maintainer or the user can install them as they are.
          if [[ "$TARGET" == *linux* ]]; then
            mkdir -p "$name/share/icons/hicolor" "$name/share/applications"
            for f in assets/icon/hicolor/prybar-*.png; do
              s="${f##*-}"; s="${s%.png}"
              mkdir -p "$name/share/icons/hicolor/${s}x${s}/apps"
              cp "$f" "$name/share/icons/hicolor/${s}x${s}/apps/prybar.png"
            done
            cp assets/icon/prybar.desktop "$name/share/applications/"
          fi
          echo "DIST_NAME=$name" >> "$GITHUB_ENV"
      - name: build app bundle
        if: runner.os == 'macOS'
        env:
          TARGET: ${{ matrix.target }}
          REF_NAME: ${{ github.ref_name }}
          # Collector URL for analytics, a repo variable set by the owner;
          # empty builds a "not configured" app that sends nothing.
          PRYBAR_TELEMETRY_URL: ${{ vars.PRYBAR_TELEMETRY_URL }}
        run: |
          cargo build --release --locked --target "$TARGET" -p prybar-gui --features workshop
          sh scripts/release/macos-bundle.sh "target/$TARGET/release/prybar-gui" "$REF_NAME" "$DIST_NAME"
      # macOS files go to the sign job unarchived; tar keeps the exec bits
      # that upload-artifact would drop.
      - name: hand off to sign job
        if: runner.os == 'macOS'
        run: tar cf stage.tar "$DIST_NAME"
      - if: runner.os == 'macOS'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: stage-${{ matrix.target }}
          path: stage.tar
      - name: archive
        if: runner.os != 'macOS'
        shell: bash
        run: |
          name="$DIST_NAME"
          if [[ "$RUNNER_OS" == "Windows" ]]; then 7z a "$name.zip" "$name" >/dev/null; file="$name.zip"
          else tar czf "$name.tar.gz" "$name"; file="$name.tar.gz"; fi
          if command -v sha256sum >/dev/null; then sha256sum "$file" > "$file.sha256"; else shasum -a 256 "$file" > "$file.sha256"; fi
      - if: runner.os != 'macOS'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dist-${{ matrix.target }}
          path: prybar-*.*

  # Signing runs apart from the build: no cargo, no third-party build code on
  # this runner, so nothing untrusted shares the job that holds the secrets.
  macos:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: x86_64-apple-darwin, os: macos-15-intel }
          - { target: aarch64-apple-darwin, os: macos-latest }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    environment: release
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          sparse-checkout: |
            scripts/release
            crates/prybar-gui/bundle
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: stage-${{ matrix.target }}
      - name: unpack
        env:
          TARGET: ${{ matrix.target }}
          REF_NAME: ${{ github.ref_name }}
        # The tarball comes from a job that ran third-party build code: keep it
        # out of the checkout so it cannot replace the scripts run next.
        run: |
          name="prybar-$REF_NAME-$TARGET"
          if tar tf stage.tar | grep -v "^$name/"; then
            echo "::error::stage.tar has entries outside $name/"
            exit 1
          fi
          mkdir "$RUNNER_TEMP/stage"
          tar xf stage.tar -C "$RUNNER_TEMP/stage"
          rm stage.tar
          echo "DIST_NAME=$RUNNER_TEMP/stage/$name" >> "$GITHUB_ENV"
          echo "DIST_BASE=$name" >> "$GITHUB_ENV"
      - name: check signing secrets
        id: signing
        if: github.repository == 'ds-kimi/prybar' && startsWith(github.ref, 'refs/tags/v')
        env:
          SET_0: ${{ secrets.MACOS_CERT_P12_BASE64 != '' }}
          SET_1: ${{ secrets.MACOS_CERT_PASSWORD != '' }}
          SET_2: ${{ secrets.MACOS_SIGN_IDENTITY != '' }}
          SET_3: ${{ secrets.APPLE_API_KEY_P8_BASE64 != '' }}
          SET_4: ${{ secrets.APPLE_API_KEY_ID != '' }}
          SET_5: ${{ secrets.APPLE_API_ISSUER_ID != '' }}
        run: sh scripts/release/macos-secrets-check.sh "$SET_0" "$SET_1" "$SET_2" "$SET_3" "$SET_4" "$SET_5"
      - name: sign and notarize
        if: steps.signing.outputs.enabled == 'true'
        env:
          MACOS_CERT_P12_BASE64: ${{ secrets.MACOS_CERT_P12_BASE64 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
          MACOS_SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
          APPLE_API_KEY_P8_BASE64: ${{ secrets.APPLE_API_KEY_P8_BASE64 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
        run: sh scripts/release/macos-sign.sh "$DIST_NAME"
      - name: remove signing keychain
        if: always() && steps.signing.outputs.enabled == 'true'
        run: sh scripts/release/macos-cleanup.sh
      - name: archive
        run: |
          ditto -c -k --keepParent "$DIST_NAME" "$DIST_BASE.zip"
          shasum -a 256 "$DIST_BASE.zip" > "$DIST_BASE.zip.sha256"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dist-${{ matrix.target }}
          path: |
            ${{ env.DIST_BASE }}.zip
            ${{ env.DIST_BASE }}.zip.sha256

  publish:
    needs: [build, macos]
    runs-on: ubuntu-latest
    # Holds UPDATE_SIGNING_KEY; this job runs no build code.
    environment: release
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: dist-*
          merge-multiple: true
      - run: cat ./*.sha256 > SHA256SUMS
      # Without the key the release ships unsigned and updaters only offer a
      # download link; see docs/release/updates.md.
      - name: check update signing key
        id: updsign
        if: github.repository == 'ds-kimi/prybar' && startsWith(github.ref, 'refs/tags/v')
        env:
          KEY_SET: ${{ secrets.UPDATE_SIGNING_KEY != '' }}
        run: |
          if [ "$KEY_SET" = "true" ]; then echo "enabled=true" >> "$GITHUB_OUTPUT"
          else echo "::notice::UPDATE_SIGNING_KEY not set, SHA256SUMS ships unsigned"; echo "enabled=false" >> "$GITHUB_OUTPUT"; fi
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        if: steps.updsign.outputs.enabled == 'true'
        with:
          persist-credentials: false
          path: src
          sparse-checkout: scripts/release
      - name: sign SHA256SUMS
        if: steps.updsign.outputs.enabled == 'true'
        env:
          UPDATE_SIGNING_KEY: ${{ secrets.UPDATE_SIGNING_KEY }}
          UPDATE_SIGNING_KEY_PASSWORD: ${{ secrets.UPDATE_SIGNING_KEY_PASSWORD }}
        run: |
          sudo apt-get install -y --no-install-recommends minisign >/dev/null
          sh src/scripts/release/sign-sums.sh SHA256SUMS
      - name: remove update signing key
        if: always() && steps.updsign.outputs.enabled == 'true'
        run: sh src/scripts/release/sign-sums-cleanup.sh
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: |
            prybar-*
            SHA256SUMS
            SHA256SUMS.minisig
